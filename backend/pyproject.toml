[project]
name = "rescuesync"
version = "0.1.0"
description = "Gestion de emergencias y coordinacion de ayuda humanitaria."
requires-python = "==3.14.*"

dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.3.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "WTForms==3.2.2",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
]

[tool.uv]
# La aplicacion se ejecuta desde el working directory, no se instala como paquete.
package = false

# Configuracion de Ruff fijada en CONTRIBUTING.md seccion 4.
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las genera Alembic con su propia plantilla: el nombre de archivo empieza
# con un numero (N999) y la plantilla importa sa y op aunque la revision no los use (F401).
"migrations/*" = ["F401", "E501", "N999", "I001", "UP035"]
# N818 exige que las excepciones terminen en "Error". El codigo del proyecto esta en espanol
# (CONTRIBUTING.md seccion 1) y la palabra va adelante: ErrorDeAplicacion, no AplicacionError.
"app/core/errores.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
