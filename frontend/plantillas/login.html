{% extends "layout.html" %}  
{% block title %} Iniciar sesión {% endblock %}  
{% block content %} 

  <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8"> 

    <div class="sm:mx-auto sm:w-full sm:max-w-sm"> 
      <img
        class="mx-auto h-21 w-auto"
        src="{{ url_for('static', filename='img/RescueSync.png') }}"
        alt="Icono RescueSync"
      > 

      <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">
        ¡Bienvenido a RescueSync!
      </h2> 
    </div> 
   
    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm"> 

      <form id="login-form" class="space-y-6" action="" method="POST"> 

        <input type="hidden" name="csrf_token" value="" /> 

        <div> 
          <label for="username" class="block text-sm/6 font-medium text-gray-900">
            Nombre de usuario
          </label> 

          <div class="mt-2"> 
            <input
              type="text"
              name="username"
              id="username"
              required
              class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            > 
          </div> 
        </div> 
   
        <div> 
          <div class="flex items-center justify-between"> 
            <label for="password" class="block text-sm/6 font-medium text-gray-900">
              Contraseña
            </label> 
          </div> 

          <div class="mt-2"> 
            <input
              type="password"
              name="password"
              id="password"
              autocomplete="current-password"
              required
              class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            > 
          </div> 
        </div> 
   
        <div> 
          <button
            id="login-button"
            type="submit"
            class="flex w-full items-center justify-center gap-2 rounded-md bg-primario px-3 py-1.5 text-sm/6 font-semibold text-white shadow-md hover:bg-primario-dark hover:shadow-primario/50 hover:-translate-y-1 active:translate-y-0.5 active:shadow-sm active:bg-primario-light transition-all duration-150 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:translate-y-0"
          >
            <!-- Spinner -->
            <svg
              id="login-spinner"
              class="hidden size-5 animate-spin"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>

              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>

            <span id="login-button-text">
              Iniciar sesión
            </span>
          </button> 
        </div> 

      </form> 
   
      <p class="mt-10 text-center text-sm/6 text-gray-500"> 
        <a
          href=""
          class="font-semibold text-primario hover:text-primario-dark hover:underline transition-colors"
        >
          ¿Olvidaste tu contraseña?
        </a> 
      </p> 

    </div> 
  </div> 

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("#login-form");
      const button = document.querySelector("#login-button");
      const spinner = document.querySelector("#login-spinner");
      const buttonText = document.querySelector("#login-button-text");

      form.addEventListener("submit", () => {
        button.disabled = true;
        spinner.classList.remove("hidden");
        buttonText.textContent = "Iniciando sesión...";
      });
    });
  </script>

{% endblock %}
